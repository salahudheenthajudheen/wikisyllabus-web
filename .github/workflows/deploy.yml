name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 20 * * *" # daily, 02:00 IST: pick up newly merged syllabi
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest WikiSyllabus
        run: git clone --depth 1 https://github.com/The-Purple-Movement/WikiSyllabus.git "$RUNNER_TEMP/ws"

      - name: Build course index
        run: python3 scripts/build_index.py "$RUNNER_TEMP/ws" "$(git -C "$RUNNER_TEMP/ws" rev-parse HEAD)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
